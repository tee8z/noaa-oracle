{{/*
Upload signing key secret - only created from an inline value. In
production point secrets.privateKey.existingSecret at a secret that holds
`daemon.pem` instead.
*/}}
{{- if .Values.secrets.privateKey.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noaa-daemon.fullname" . }}-keys
  labels:
    {{- include "noaa-daemon.labels" . | nindent 4 }}
type: Opaque
stringData:
  daemon.pem: {{ .Values.secrets.privateKey.value | quote }}
{{- end }}
