# NOAA Daemon Helm Chart Values
# Weather data fetching daemon (runs continuously)

image:
  repository: ghcr.io/tee8z/noaa-daemon
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

# Sleep interval between data fetches (in seconds)
# Default: 3600 (1 hour)
sleepInterval: 3600

resources:
  requests:
    memory: 64Mi
    cpu: 25m
  limits:
    memory: 128Mi

podSecurityContext: {}
securityContext: {}

# Application configuration
config:
  # Logging level
  level: "info"
  # Oracle server URL to upload data to. Uploads are signed over this URL,
  # so it must equal the oracle's config.remoteUrl.
  baseUrl: "http://noaa-oracle.oracle.svc.cluster.local:9800"
  # Parquet files stay here until published and older than retentionDays
  dataDir: /tmp/noaa-daemon
  # Discard a run when fewer than this fraction of stations got a forecast
  minForecastCoverage: 0.8
  # Days to keep published parquet files in dataDir
  retentionDays: 7
  # HTTP client settings
  # User-Agent header for NOAA API requests (include contact info)
  userAgent: "4casttruth/1.0 (https://www.4casttruth.win/; 5day4cast@protonmail.com)"
  refillRate: 15.0
  tokenCapacity: 3

# S3 storage for parquet archival (requires 's3' feature in binary)
s3:
  enabled: false
  bucket: ""
  region: ""
  # Endpoint URL (for moto/localstack, leave empty for AWS)
  endpoint: ""
  # AWS credentials (for local dev with moto)
  accessKeyId: ""
  secretAccessKey: ""

# Upload signing key. The oracle accepts uploads only from npubs listed in
# its config.uploaderPubkeys, so the key must survive pod restarts: provide
# it as a secret with a `daemon.pem` entry (raw 32-byte secp256k1 secret in
# an `EC PRIVATE KEY` PEM). Without a secret the daemon creates a key under
# dataDir on every start, and its npub changes with each restart.
secrets:
  privateKey:
    # Set to true to create a secret from the value below
    create: false
    # The private key PEM content (for local dev only - use external secrets in prod)
    value: ""
    # Name of an existing secret holding `daemon.pem`
    existingSecret: ""

# Environment variables
env: {}
envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# Dev mode configuration for fast local development
devMode:
  enabled: false
  hostPath: /mnt/noaa-oracle/daemon
  baseImage: debian:bookworm-slim
