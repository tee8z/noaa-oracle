name: Release

on:
  push:
    tags:
      - "v*.*.*"
    # A push to master builds the release binaries to warm their caches (see
    # prepare-release), so a tagged release, including a hotfix, compiles only
    # the workspace's own crates.
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.9.3)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build only, no release)"
        required: false
        type: boolean
        default: true

# Releases run one at a time; on a branch a newer push replaces a warm pass.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Extract version from tag or input
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_name: ${{ steps.get_version.outputs.version_name }}
      dry_run: ${{ steps.get_version.outputs.dry_run }}
      build_images: ${{ steps.get_version.outputs.build_images }}
      warm: ${{ steps.get_version.outputs.warm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get version from tag or input
        id: get_version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$RELEASE_EVENT" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            # Cache warming on master: build like a release, publish nothing.
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            {
              echo "version=$VERSION"
              echo "version_name=v$VERSION"
              echo "dry_run=true"
              echo "build_images=false"
              echo "warm=true"
            } >> "$GITHUB_OUTPUT"
            echo "Warming release caches at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
            DRY_RUN="$REQUESTED_DRY_RUN"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            DRY_RUN="false"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release version must have the form MAJOR.MINOR.PATCH" >&2
            exit 1
          }
          [[ "$DRY_RUN" = true || "$DRY_RUN" = false ]] || exit 1
          {
            echo "version=$VERSION"
            echo "version_name=v$VERSION"
            echo "dry_run=$DRY_RUN"
            echo "build_images=true"
            echo "warm=false"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (dry_run: $DRY_RUN)"

  # Validate the tagged source; release jobs never rewrite commits or tags.
  # Runs beside the build; nothing publishes until it passes.
  validate-versions:
    name: Validate Versions
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.warm != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check package and chart versions
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python3 scripts/validate-release-versions.py "$RELEASE_VERSION"

  # Native binaries per architecture, packaged in the same job (packaging is
  # only copying and archiving). They also go into the container images.
  build-release:
    name: Build Release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            system: x86_64-linux
            image_arch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            system: aarch64-linux
            image_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Deleting these took minutes in the foreground; the build doesn't need
      # the space until well after it has started.
      - name: Free disk space (in the background)
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker image prune --all --force; apt-get clean' \
            >/dev/null 2>&1 &

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          echo "channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      # Compiled dependencies come from the cache that pushes to master write;
      # only those runs save it, so a pull request can't change what a
      # release links. The workspace's own crates always compile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ needs.prepare-release.outputs.warm == 'true' }}

      # The library version and hash pinned in flake.nix.
      - name: Fetch the DuckDB library
        run: python3 .github/scripts/fetch_duckdb.py "${{ matrix.system }}" "$RUNNER_TEMP/duckdb"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          DUCKDB_LIB_DIR: ${{ runner.temp }}/duckdb
          DUCKDB_INCLUDE_DIR: ${{ runner.temp }}/duckdb
          # The oracle finds libduckdb.so beside it in lib/ (the zip, the
          # image's /lib) without LD_LIBRARY_PATH.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/../lib"
        run: cargo build --release --locked --target "$TARGET" --bin oracle --bin daemon

      # The images run on Debian 13 (glibc 2.41); the build host is older.
      - name: Check the binaries' runtime libraries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in oracle daemon; do
            file="target/$TARGET/release/$bin"
            readelf -d "$file" | grep -E 'NEEDED|RUNPATH'
            glibc=$(objdump -T "$file" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
            echo "$bin needs $glibc"
            [ "$(printf '%s\nGLIBC_2.41\n' "$glibc" | sort -V | tail -1)" = GLIBC_2.41 ] || {
              echo "$bin needs $glibc, newer than the image's glibc 2.41" >&2
              exit 1
            }
          done

      - name: Create release package
        if: needs.prepare-release.outputs.warm != 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/package-release.sh "$VERSION" "$ARCH" "target/$TARGET/release" "$RUNNER_TEMP/duckdb"

      - name: Upload release artifacts
        if: needs.prepare-release.outputs.warm != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}-linux
          path: release/*
          if-no-files-found: error
          retention-days: 7

      # The container images copy these instead of compiling again.
      - name: Stage the image files
        if: needs.prepare-release.outputs.build_images == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p image-files
          cp "target/$TARGET/release/oracle" "target/$TARGET/release/daemon" "$RUNNER_TEMP/duckdb/libduckdb.so" image-files/

      - name: Upload the image files
        if: needs.prepare-release.outputs.build_images == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image_arch }}
          path: image-files/*
          if-no-files-found: error
          retention-days: 7

  # Create GitHub release (skipped in dry-run). The tarballs don't wait for
  # the container images, which publish on their own.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-versions, build-release]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.prepare-release.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Images assembled from build-release's binaries: nothing compiles here.
  # The Dockerfiles have no RUN step, so both architectures build on one
  # amd64 runner without emulation (QEMU only runs the smoke test).
  build-docker:
    name: Build Docker Images (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-versions, build-release]
    if: needs.prepare-release.outputs.build_images == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-files

      - name: Assemble the image context
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "image/bin/$ARCH" "image/lib/$ARCH" image/share/noaa-oracle/static
          # Artifacts don't keep file modes.
          install -m 755 image-files/oracle image-files/daemon "image/bin/$ARCH/"
          install -m 755 image-files/libduckdb.so "image/lib/$ARCH/"
          cp -r config image/share/noaa-oracle/
          echo 'UI assets are embedded in bin/oracle.' > image/share/noaa-oracle/static/.embedded
          ls -lR image

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
        with:
          platforms: ${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          for image in oracle daemon; do
            docker buildx build --platform "linux/$ARCH" --load \
              -f "deploy/docker/$image.Dockerfile" \
              -t "ghcr.io/$REPO_LOWER/$image:$VERSION-$ARCH" \
              -t "ghcr.io/$REPO_LOWER/$image:latest-$ARCH" \
              image
          done

      # Both binaries start in their images: the loader finds every library.
      - name: Smoke test the images
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          docker run --rm --platform "linux/$ARCH" "ghcr.io/$REPO_LOWER/oracle:$VERSION-$ARCH" /bin/oracle --version
          docker run --rm --platform "linux/$ARCH" "ghcr.io/$REPO_LOWER/daemon:$VERSION-$ARCH" /bin/daemon --help > /dev/null
          docker image ls "ghcr.io/$REPO_LOWER/*"

      - name: Log in to GHCR
        if: needs.prepare-release.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: needs.prepare-release.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          for image in oracle daemon; do
            docker push "ghcr.io/$REPO_LOWER/$image:$VERSION-$ARCH"
            docker push "ghcr.io/$REPO_LOWER/$image:latest-$ARCH"
          done

  # Create multi-arch Docker manifests
  create-docker-manifest:
    name: Create Docker Manifest
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [oracle, daemon]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_NAME}"

          # Create and push multi-arch manifests
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"

          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          docker manifest push "${IMAGE}:latest"

          echo "Pushed multi-arch image: ${IMAGE}:${VERSION}"
