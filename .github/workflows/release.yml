name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.9.3)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build only, no release)"
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Extract version from tag or input
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_name: ${{ steps.get_version.outputs.version_name }}
      dry_run: ${{ steps.get_version.outputs.dry_run }}
    steps:
      - name: Get version from tag or input
        id: get_version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
            DRY_RUN="$REQUESTED_DRY_RUN"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            DRY_RUN="false"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release version must have the form MAJOR.MINOR.PATCH" >&2
            exit 1
          }
          [[ "$DRY_RUN" = true || "$DRY_RUN" = false ]] || exit 1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (dry_run: $DRY_RUN)"

  # Validate the tagged source; release jobs never rewrite commits or tags.
  validate-versions:
    name: Validate Versions
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - name: Check package and chart versions
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import tomllib

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Release version must have the form MAJOR.MINOR.PATCH")
          workspace = tomllib.loads(Path("Cargo.toml").read_text())
          versions = {"workspace": workspace["workspace"]["package"]["version"]}
          packages = ("daemon", "noaa-oracle-core", "oracle")
          locked = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          for name in packages:
              matches = [package for package in locked if package["name"] == name]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one lockfile entry for {name}")
              versions[f"Cargo.lock:{name}"] = matches[0]["version"]
          for member in workspace["workspace"]["members"]:
              manifest = tomllib.loads(Path(member, "Cargo.toml").read_text())
              if manifest["package"]["version"] != {"workspace": True}:
                  raise SystemExit(f"{member} must inherit the workspace version")
          flake = Path("flake.nix").read_text()
          for name in ("oracle", "daemon"):
              match = re.search(r'pname = "' + name + r'";\s+version = "([^"]+)";', flake)
              if match is None:
                  raise SystemExit(f"Missing Nix package version for {name}")
              versions[f"flake.nix:{name}"] = match.group(1)
          for name in ("noaa-oracle", "noaa-daemon"):
              chart = Path("deploy/helm", name, "Chart.yaml")
              match = re.search(r'^appVersion: "([^"]+)"$', chart.read_text(), re.MULTILINE)
              if match is None:
                  raise SystemExit(f"Missing appVersion in {chart}")
              versions[str(chart)] = match.group(1)
          for source, actual in versions.items():
              if actual != version:
                  raise SystemExit(f"{source}: expected {version}, found {actual}")
          print(f"Validated all package and chart versions: {version}")
          PYTHON

  # Build release binaries for x86_64 using Nix
  build-release-x86_64:
    name: Build Release (x86_64)
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-versions]
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Build with Nix
        run: |
          nix build .#oracle --print-build-logs
          nix build .#daemon --print-build-logs -o result-daemon

      - name: Build with Cargo (for compatibility)
        run: |
          nix develop -c cargo build --release --locked --workspace
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

      - name: Create release package
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          PKG_NAME="noaa-oracle-${VERSION}-x86_64-linux"

          mkdir -p "${PKG_NAME}/bin"
          mkdir -p "${PKG_NAME}/config"

          # Copy the Nix-built binaries and the UI files the oracle serves from ui_dir
          cp result/bin/oracle "${PKG_NAME}/bin/"
          cp result-daemon/bin/daemon "${PKG_NAME}/bin/"
          mkdir -p "${PKG_NAME}/static"
          cp -r result/share/noaa-oracle/static/. "${PKG_NAME}/static/"

          # Copy and rename config examples to usable defaults
          cp config/oracle.example.toml "${PKG_NAME}/config/oracle.toml"
          cp config/daemon.example.toml "${PKG_NAME}/config/daemon.toml"
          # Signed uploads must use the same origin as the packaged oracle config.
          sed -i 's|^base_url = "http://localhost:9800"$|base_url = "http://127.0.0.1:9800"|' "${PKG_NAME}/config/daemon.toml"

          # Create setup script for first-time deployment
          cat > "${PKG_NAME}/setup.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          echo "NOAA Oracle Setup"
          echo "================="

          # Create data directories
          echo "Creating data directories..."
          mkdir -p weather_data event_data logs data

          echo "Each service creates its signing key with mode 0600 on first startup."
          echo "Existing keys remain in place. Back up both keys after startup."
          echo "The oracle needs its original key to attest existing events."

          echo ""
          echo "Setup complete! You can now run:"
          echo "  ./run-oracle.sh  - Start the oracle server"
          echo "  ./run-daemon.sh  - Start the data fetching daemon"
          EOF
          chmod +x "${PKG_NAME}/setup.sh"

          # Create run script for oracle
          cat > "${PKG_NAME}/run-oracle.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          # Create data directories if missing
          mkdir -p weather_data event_data logs

          export RUST_LOG="${RUST_LOG:-info}"
          export NOAA_ORACLE_CONFIG="${NOAA_ORACLE_CONFIG:-$SCRIPT_DIR/config/oracle.toml}"
          exec ./bin/oracle "$@"
          EOF
          chmod +x "${PKG_NAME}/run-oracle.sh"

          # Create run script for daemon
          cat > "${PKG_NAME}/run-daemon.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          mkdir -p data logs

          export RUST_LOG="${RUST_LOG:-info}"
          export NOAA_DAEMON_CONFIG="${NOAA_DAEMON_CONFIG:-$SCRIPT_DIR/config/daemon.toml}"
          exec ./bin/daemon "$@"
          EOF
          chmod +x "${PKG_NAME}/run-daemon.sh"

          # Create README
          cat > "${PKG_NAME}/README.txt" << EOF
          NOAA Oracle v${VERSION}
          =======================

          Quick Start:
            1. Run ./setup.sh to create the data directories
            2. Run ./run-oracle.sh to start the oracle and create its key (port 9800)
            3. Run ./run-daemon.sh to create its key and start fetching NOAA weather data
            4. Copy the npub the daemon logs at startup into uploader_pubkeys
               in config/oracle.toml and restart the oracle; until then the
               oracle rejects the daemon's uploads (401)

          Configuration:
            - Edit config/oracle.toml for oracle settings
            - Edit config/daemon.toml for daemon settings
            - Keep daemon base_url equal to oracle remote_url, including scheme, host, and port
            - The run scripts load these files; --config or NOAA_ORACLE_CONFIG /
              NOAA_DAEMON_CONFIG can select another file

          Directories:
            - config/       Configuration files
            - bin/          Service binaries
            - static/       Browser UI files served by the oracle
            - weather_data/ Downloaded parquet files (created on first run)
            - event_data/   DLC event database (created on first run)

          Security:
            - oracle_private_key.pem is your signing key - BACK IT UP!
            - daemon_private_key.pem signs the daemon's uploads; its npub is
              what uploader_pubkeys lists, so back it up too
            - Each service creates its key with mode 0600 if the key is missing
            - Keep both keys secret and preserve them across upgrades

          For more info: https://github.com/tee8z/noaa-oracle
          EOF

          # Create zip
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}"

          # Also create separate tarballs for cargo-built binaries
          mkdir -p release
          mv "${PKG_NAME}.zip" release/

          # Cargo binaries tarball (for users who prefer dynamic linking).
          # The oracle serves its UI from ui_dir (build.rs generates it; the
          # Nix build installs a copy), so ship those files alongside.
          mkdir -p cargo-pkg/bin cargo-pkg/static
          cp target/release/oracle cargo-pkg/bin/
          cp target/release/daemon cargo-pkg/bin/
          cp -r result/share/noaa-oracle/static/. cargo-pkg/static/
          tar czf "release/noaa-oracle-${VERSION}-x86_64-linux-cargo.tar.gz" -C cargo-pkg .
          rm -rf cargo-pkg

          ls -lh release/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-linux
          path: release/*
          retention-days: 7

  # Build release binaries for ARM64 (aarch64) using native ARM64 runner
  build-release-arm64:
    name: Build Release (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [prepare-release, validate-versions]
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Build with Nix for ARM64 (native)
        run: |
          # Build natively on ARM64 runner
          nix build .#oracle --print-build-logs
          nix build .#daemon --print-build-logs -o result-daemon

      - name: Create release package
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          PKG_NAME="noaa-oracle-${VERSION}-aarch64-linux"

          mkdir -p "${PKG_NAME}/bin"
          mkdir -p "${PKG_NAME}/config"

          # Copy the Nix-built binaries and the UI files the oracle serves from ui_dir
          cp result/bin/oracle "${PKG_NAME}/bin/"
          cp result-daemon/bin/daemon "${PKG_NAME}/bin/"
          mkdir -p "${PKG_NAME}/static"
          cp -r result/share/noaa-oracle/static/. "${PKG_NAME}/static/"

          # Copy and rename config examples to usable defaults
          cp config/oracle.example.toml "${PKG_NAME}/config/oracle.toml"
          cp config/daemon.example.toml "${PKG_NAME}/config/daemon.toml"
          # Signed uploads must use the same origin as the packaged oracle config.
          sed -i 's|^base_url = "http://localhost:9800"$|base_url = "http://127.0.0.1:9800"|' "${PKG_NAME}/config/daemon.toml"

          # Create setup script for first-time deployment
          cat > "${PKG_NAME}/setup.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          echo "NOAA Oracle Setup"
          echo "================="

          # Create data directories
          echo "Creating data directories..."
          mkdir -p weather_data event_data logs data

          echo "Each service creates its signing key with mode 0600 on first startup."
          echo "Existing keys remain in place. Back up both keys after startup."
          echo "The oracle needs its original key to attest existing events."

          echo ""
          echo "Setup complete! You can now run:"
          echo "  ./run-oracle.sh  - Start the oracle server"
          echo "  ./run-daemon.sh  - Start the data fetching daemon"
          EOF
          chmod +x "${PKG_NAME}/setup.sh"

          # Create run script for oracle
          cat > "${PKG_NAME}/run-oracle.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          # Create data directories if missing
          mkdir -p weather_data event_data logs

          export RUST_LOG="${RUST_LOG:-info}"
          export NOAA_ORACLE_CONFIG="${NOAA_ORACLE_CONFIG:-$SCRIPT_DIR/config/oracle.toml}"
          exec ./bin/oracle "$@"
          EOF
          chmod +x "${PKG_NAME}/run-oracle.sh"

          # Create run script for daemon
          cat > "${PKG_NAME}/run-daemon.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          mkdir -p data logs

          export RUST_LOG="${RUST_LOG:-info}"
          export NOAA_DAEMON_CONFIG="${NOAA_DAEMON_CONFIG:-$SCRIPT_DIR/config/daemon.toml}"
          exec ./bin/daemon "$@"
          EOF
          chmod +x "${PKG_NAME}/run-daemon.sh"

          # Create README
          cat > "${PKG_NAME}/README.txt" << EOF
          NOAA Oracle v${VERSION} (ARM64/aarch64)
          =======================================

          Quick Start:
            1. Run ./setup.sh to create the data directories
            2. Run ./run-oracle.sh to start the oracle and create its key (port 9800)
            3. Run ./run-daemon.sh to create its key and start fetching NOAA weather data
            4. Copy the npub the daemon logs at startup into uploader_pubkeys
               in config/oracle.toml and restart the oracle; until then the
               oracle rejects the daemon's uploads (401)

          Configuration:
            - Edit config/oracle.toml for oracle settings
            - Edit config/daemon.toml for daemon settings
            - Keep daemon base_url equal to oracle remote_url, including scheme, host, and port
            - The run scripts load these files; --config or NOAA_ORACLE_CONFIG /
              NOAA_DAEMON_CONFIG can select another file

          Directories:
            - config/       Configuration files
            - bin/          Service binaries
            - static/       Browser UI files served by the oracle
            - weather_data/ Downloaded parquet files (created on first run)
            - event_data/   DLC event database (created on first run)

          Security:
            - oracle_private_key.pem is your signing key - BACK IT UP!
            - daemon_private_key.pem signs the daemon's uploads; its npub is
              what uploader_pubkeys lists, so back it up too
            - Each service creates its key with mode 0600 if the key is missing
            - Keep both keys secret and preserve them across upgrades

          For more info: https://github.com/tee8z/noaa-oracle
          EOF

          # Create zip
          mkdir -p release
          zip -r "release/${PKG_NAME}.zip" "${PKG_NAME}"

          ls -lh release/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64-linux
          path: release/*
          retention-days: 7

  # Create GitHub release (skipped in dry-run)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release-x86_64, build-release-arm64]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ needs.prepare-release.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker images to GHCR (amd64)
  build-docker-amd64:
    name: Build Docker Images (amd64)
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-versions]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: oracle
            nix_output: docker-oracle
          - image: daemon
            nix_output: docker-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag x86_64 image
        run: |
          nix build .#${{ matrix.nix_output }} --print-build-logs
          docker load < result
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag noaa-${{ matrix.image }}:latest ghcr.io/${REPO_LOWER}/${{ matrix.image }}:${{ needs.prepare-release.outputs.version }}-amd64
          docker tag noaa-${{ matrix.image }}:latest ghcr.io/${REPO_LOWER}/${{ matrix.image }}:latest-amd64

          if [ "${{ needs.prepare-release.outputs.dry_run }}" != "true" ]; then
            docker push ghcr.io/${REPO_LOWER}/${{ matrix.image }}:${{ needs.prepare-release.outputs.version }}-amd64
            docker push ghcr.io/${REPO_LOWER}/${{ matrix.image }}:latest-amd64
          fi

  # Build and push Docker images to GHCR (arm64) using native ARM64 runner
  build-docker-arm64:
    name: Build Docker Images (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [prepare-release, validate-versions]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: oracle
            nix_output: docker-oracle
          - image: daemon
            nix_output: docker-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag ARM64 image
        run: |
          nix build .#${{ matrix.nix_output }} --print-build-logs
          docker load < result
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag noaa-${{ matrix.image }}:latest ghcr.io/${REPO_LOWER}/${{ matrix.image }}:${{ needs.prepare-release.outputs.version }}-arm64
          docker tag noaa-${{ matrix.image }}:latest ghcr.io/${REPO_LOWER}/${{ matrix.image }}:latest-arm64

          if [ "${{ needs.prepare-release.outputs.dry_run }}" != "true" ]; then
            docker push ghcr.io/${REPO_LOWER}/${{ matrix.image }}:${{ needs.prepare-release.outputs.version }}-arm64
            docker push ghcr.io/${REPO_LOWER}/${{ matrix.image }}:latest-arm64
          fi

  # Create multi-arch Docker manifests
  create-docker-manifest:
    name: Create Docker Manifest
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker-amd64, build-docker-arm64]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [oracle, daemon]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/${{ matrix.image }}"

          # Create and push multi-arch manifests
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64
          docker manifest push ${IMAGE}:${VERSION}

          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:latest-amd64 \
            ${IMAGE}:latest-arm64
          docker manifest push ${IMAGE}:latest

          echo "Pushed multi-arch image: ${IMAGE}:${VERSION}"
