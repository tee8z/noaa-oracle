# NOAA Oracle Server Configuration
#
# The Oracle is a REST API server that:
#   1. Serves weather data (parquet files) via HTTP
#   2. Hosts a browser UI for querying weather data
#   3. Manages prediction events and signs outcomes for DLC (dlctix) contracts
#
# The Oracle can run INDEPENDENTLY of the daemon - just point it at a directory
# containing weather data parquet files (e.g., downloaded from another source).
#
# Copy this file to one of these locations:
#   - ./oracle.toml (current directory)
#   - $XDG_CONFIG_HOME/noaa-oracle/oracle.toml (~/.config/noaa-oracle/)
#   - /etc/noaa-oracle/oracle.toml (system-wide)
#
# Or specify a custom path with: oracle --config /path/to/config.toml
#
# All settings can also be set via environment variables:
#   NOAA_ORACLE_LEVEL, NOAA_ORACLE_HOST, NOAA_ORACLE_PORT, etc.
# Unknown keys are rejected, so a typo fails startup instead of being ignored.

# Logging level: trace, debug, info, warn, error
level = "info"

# Server binding
host = "127.0.0.1"    # Use "0.0.0.0" to listen on all interfaces
port = 9800

# Public origin clients use to reach the oracle (scheme://host[:port], no
# path). Coordinators and the daemon sign NIP-98 requests over this URL, so
# behind a proxy set it to the public address, e.g. "https://4casttruth.win".
remote_url = "http://127.0.0.1:9800"

# =============================================================================
# Who may write
# =============================================================================
# Every write is a NIP-98 signed request from an allowlisted nostr key
# (npub or hex). Empty lists mean nobody can do that operation.
#
# Coordinators create events and submit entries.
coordinator_pubkeys = []
# Uploaders publish parquet files and trigger processing (the daemon logs
# its npub at startup).
uploader_pubkeys = []

# Seconds between scheduled scoring and signing passes. Uploads also start
# a pass.
etl_interval = 300

# =============================================================================
# Weather Data Storage
# =============================================================================
# Directory containing parquet files with weather observations and forecasts.
# Structure: data_dir/YYYY-MM-DD/observations_*.parquet, forecasts_*.parquet
#
# This can be:
#   - Populated by the daemon (automatic)
#   - Downloaded/synced from another oracle
#   - Manually populated with historical data
#
# For user installs: ~/.local/share/noaa-oracle/weather/
# For system installs: /var/lib/noaa-oracle/weather/
data_dir = "./weather_data"

# =============================================================================
# Event Database (DLC Contract State)
# =============================================================================
# SQLite database storing prediction events, entries, and attestations.
# This is where the oracle tracks:
#   - Active prediction events
#   - User entries/predictions
#   - Signed attestations for completed events
#
# For user installs: ~/.local/share/noaa-oracle/events/
# For system installs: /var/lib/noaa-oracle/events/
event_db = "./event_data"

# =============================================================================
# Static Files & Keys
# =============================================================================
# Static files directory (CSS, JS assets built by build.rs)
# For development: ./static (populated automatically during cargo build)
# For Nix installs: set automatically to the package's share directory
ui_dir = "./static"

# Oracle signing key (secp256k1, PEM). Used for DLC attestations and as the
# oracle's nostr identity - keep it secret. Generated with mode 0600 if it
# doesn't exist; the oracle refuses to start if the file is readable by
# group or others.
private_key_path = "./oracle_private_key.pem"

# =============================================================================
# Shutdown
# =============================================================================
# Seconds allowed for in-flight requests, background work, and accepted
# database writes to finish after SIGTERM. Keep this below the container's
# termination grace period.
shutdown_timeout = 25
