[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/oracle"]

[workspace.package]
version = "2.8.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tee8z/noaa-oracle"
authors = ["tee8z"]

[workspace.dependencies]
# Internal crates
noaa-oracle-core = { path = "crates/core" }

# Errors and serialization
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Async runtime; each crate enables only the features it uses
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

# Logging
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
slog = "2.8"
slog-term = "2.9"
slog-async = "2.8"

# Time
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }

# Parquet 59 removes the legacy thrift dependency. Leave Arrow integration
# disabled; these dependencies only write the daemon's Parquet records.
parquet = { version = "59.3", default-features = false, features = ["zstd"] }
parquet_derive = "59.3"

# S3
# Use the current AWS HTTPS connector; the legacy rustls feature selects rustls 0.21.
aws-sdk-s3 = { version = "1.148", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1.12", features = ["behavior-version-latest"] }

# Testing
tempfile = "3.27"

# Suppress warnings from dependencies using non-standard cfg values
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_arch, values(\"amdgpu\"))"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
