[package]
name = "oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NOAA Oracle REST API server and DLC attestation service"

[[bin]]
name = "oracle"
path = "src/main.rs"

[features]
default = []
bundled = ["duckdb/bundled"]

[dependencies]
# Internal
noaa-oracle-core.workspace = true

# Core
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# CLI
clap.workspace = true

# Async
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
futures.workspace = true

# Web framework
axum = { version = "0.8", features = ["http1", "json", "multipart", "query", "tokio", "original-uri"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "compression-gzip"] }
maud = { version = "0.27", features = ["axum"] }

# Weather data (parquet files queried in-process)
duckdb = "1.10505"

# Event database. Keep in step with rust-toolchain.toml and the flake
# (`sqlite` in the dev shell) when bumping.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# DLC / Crypto
dlctix = "0.1.0"
nostr = { version = "0.45", default-features = false, features = ["std", "nip98"] }
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
base64 = "0.23"
# Match the rand version enabled by dlctix's secp256k1 so key and nonce
# generation share one RNG API.
rand = "0.9"
sha2 = "0.11"
zeroize = "1.8"

# Logging
log = { workspace = true, features = ["serde"] }
fern.workspace = true
tracing-appender = "0.2"

# Time
time.workspace = true
# Readers' local days: IANA time zones and their daylight-saving rules.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

# API docs
utoipa = { version = "5.5", features = ["axum_extras", "time", "uuid", "preserve_order", "preserve_path_order"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# S3 (optional at runtime, for serving parquet files from a bucket)
aws-sdk-s3.workspace = true
aws-config.workspace = true

# Other
uuid = { version = "1.26", features = ["v7", "serde"] }
itertools = "0.15"
async-trait = "0.1"

[build-dependencies]
flate2 = "1.1"
hex = "0.4"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
oxc = { version = "=0.151.0", default-features = false, features = ["codegen", "minifier"] }
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
flate2 = "1.1"
mockall = "0.15"
tempfile.workspace = true
toml.workspace = true
# Tests generate keys and sign NIP-98 events; the server only verifies them.
nostr = { version = "0.45", features = ["os-rng"] }
# The daemon's publisher is driven against the oracle over HTTP.
daemon = { path = "../daemon" }
slog.workspace = true
futures = { workspace = true, features = ["async-await"] }

[package.metadata.cargo-machete]
ignored = ["flate2", "hex", "lightningcss", "oxc"]

[lints]
workspace = true
