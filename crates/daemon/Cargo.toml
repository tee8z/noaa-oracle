[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NOAA weather data fetcher daemon"

[[bin]]
name = "daemon"
path = "src/main.rs"

[dependencies]
# Internal
noaa-oracle-core.workspace = true

# Core
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"

# CLI
clap.workspace = true

# Async
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
futures.workspace = true

# HTTP
reqwest = { workspace = true }
reqwest-retry = "0.9"
reqwest-middleware = "0.5"

# Logging
slog.workspace = true
slog-term.workspace = true
slog-async.workspace = true

# Time
time.workspace = true

# Data
parquet.workspace = true
parquet_derive.workspace = true

# XML parsing
serde-xml-rs = "0.8"

# Compression
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

# Upload signing (NIP-98) and key storage
nostr = { version = "0.45", default-features = false, features = ["std", "nip98", "os-rng"] }
sha2 = "0.11"
base64 = "0.23"
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
zeroize = "1.8"

# S3 archival
aws-sdk-s3.workspace = true
aws-config.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
